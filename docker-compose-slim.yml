version: "3"
# this file uses prebuilt image in dockerhub
services:
  jekyll:
    image: amirpourmand/al-folio:slim
    #build: .
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - JEKYLL_ENV=development
